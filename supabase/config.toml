
[functions.mailerlite-sync]
enabled = true
verify_jwt = true
import_map = "./functions/mailerlite-sync/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/mailerlite-sync/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/mailerlite-sync/*.html" ]

[functions.stripe-webhook]
enabled = true
verify_jwt = false
# Stripe webhooks don't use JWT - they use signature verification instead

